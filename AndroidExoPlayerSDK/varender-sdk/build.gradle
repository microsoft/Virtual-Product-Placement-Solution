apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.microsoft.varender.sdk"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 28
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // media3 pinned to 1.4.1 because 1.5+ requires compileSdk 35 and the host
    // demo app is locked to compileSdk 34 / AGP 7.1.2.
    api "androidx.media3:media3-exoplayer:1.4.1"
    api "androidx.media3:media3-effect:1.4.1"
    api "androidx.media3:media3-common:1.4.1"
    api "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // GIF decoding (native, handles disposal correctly, exposes per-frame Bitmap).
    // Pinned to 1.2.25 — newer 1.2.28/1.2.29 ship class files whose Kotlin
    // metadata trips a NullPointerException in the D8 bundled with AGP 7.1.2.
    // 1.2.25 has the same public API and dexes cleanly.
    implementation "pl.droidsonroids.gif:android-gif-drawable:1.2.25"
}

apply from: "$rootDir/publish.gradle"

