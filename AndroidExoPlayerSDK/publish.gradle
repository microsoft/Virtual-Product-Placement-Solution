// Publish configuration for the varender-sdk Android library.
// Applied from varender-sdk/build.gradle via `apply from: "$rootDir/publish.gradle"`.

apply plugin: 'maven-publish'
apply plugin: 'signing'

def sdkGroupId    = 'com.microsoft.varender'
def sdkArtifactId = 'varender-sdk'
def sdkVersion    = project.findProperty('sdkVersion') ?: '1.0.0'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId    = sdkGroupId
                artifactId = sdkArtifactId
                version    = sdkVersion

                pom {
                    name        = 'VARender SDK'
                    description = 'ExoPlayer (AndroidX Media3) based virtual ads rendering SDK for Android.'
                    url         = 'https://github.com/microsoft/Virtual-Product-Placement-Solution'
                    licenses {
                        license {
                            name = 'MIT'
                            url  = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    developers {
                        developer {
                            id   = 'microsoft'
                            name = 'Microsoft'
                        }
                    }
                    scm {
                        url                 = 'https://github.com/microsoft/Virtual-Product-Placement-Solution'
                        connection          = 'scm:git:https://github.com/microsoft/Virtual-Product-Placement-Solution.git'
                        developerConnection = 'scm:git:ssh://git@github.com/microsoft/Virtual-Product-Placement-Solution.git'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'sonatype'
                def releasesUrl  = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                def snapshotsUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
                url = sdkVersion.toString().endsWith('SNAPSHOT') ? snapshotsUrl : releasesUrl
                credentials {
                    username = project.findProperty('sonatypeUsername') ?: ''
                    password = project.findProperty('sonatypePassword') ?: ''
                }
            }
        }
    }

    signing {
        def key = project.findProperty('signingKey')
        def pwd = project.findProperty('signingPassword')
        if (key) {
            useInMemoryPgpKeys(key, pwd)
            sign publishing.publications.release
        }
    }
}

android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}
