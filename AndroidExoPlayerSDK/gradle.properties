org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=true

# Jetifier: auto-transforms legacy support-library bytecode to AndroidX.
android.enableJetifier=true
# Skip Jetifier on libs that are already AndroidX — needless re-rewriting corrupts
# the bytecode of pl.droidsonroids:android-gif-drawable and triggers a D8
# NullPointerException during dexing under AGP 7.1.2 + JDK 17.
android.jetifier.ignorelist=android-gif-drawable

android.suppressUnsupportedCompileSdk=34
