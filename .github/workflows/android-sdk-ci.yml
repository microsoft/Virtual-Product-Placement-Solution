name: AndroidExoPlayerSDK CI

on:
  push:
    branches: [main]
    paths:
      - 'AndroidExoPlayerSDK/**'
      - '.github/workflows/android-sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AndroidExoPlayerSDK/**'
      - '.github/workflows/android-sdk-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('AndroidExoPlayerSDK/**/*.gradle*', 'AndroidExoPlayerSDK/**/gradle-wrapper.properties') }}
      - name: Build AAR
        working-directory: AndroidExoPlayerSDK
        run: ./gradlew :varender-sdk:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: varender-sdk-aar
          path: AndroidExoPlayerSDK/varender-sdk/build/outputs/aar/*.aar
